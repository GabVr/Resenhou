services:
  mysql:
    image:  mysql:latest
    container_name: resenhou_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    env_file:
      - .env
      - .env.properties
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\"" ]
      interval: 10s
      timeout: 5s
      retries: 5

  catalogo:
      build:
        context: .
        dockerfile: catalogo/Dockerfile
      container_name: catalogo-app
      restart: unless-stopped

      ports:
        - "8081:8080"
      depends_on:
        mysql:
          condition: service_healthy
      env_file:
        - .env
        - .env.properties


  leitura:
      build:
        context: .
        dockerfile: leitura/Dockerfile
      container_name: leitura-app
      restart: unless-stopped

      ports:
        - "8082:8080"
      depends_on:
        mysql:
          condition: service_healthy
      env_file:
        - .env
        - .env.properties

  usuarios:
    build:
     context: .
     dockerfile: usuarios/Dockerfile
    container_name: usuario-app
    restart: unless-stopped
    ports:
      - "8083:8080"
    depends_on:
      mysql:
        condition: service_healthy

    env_file:
      - .env
      - .env.properties

  resenhou-web:
    environment:
      USUARIOS_URL: http://usuarios:8080
    build:
      context: ./resenhou-web
      dockerfile: Dockerfile
    container_name: web-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

    env_file:
      - .env
      - .env.properties

volumes:
  db_data:


